services:
  localstack:
    user: "0:0"
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
      - PERSISTENCE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      # tieni solo i servizi che usi davvero
      - SERVICES=lambda,events,iam,logs,sts,s3,sqs,dynamodb,apigateway
      # fondamentale per far girare Lambda su LocalStack (Docker-in-Docker via socket)
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      # socket Docker di Colima -> dentro al container come /var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      # persistenza stato LocalStack
      - ./data:/var/lib/localstack
      # init scripts (opzionale ma consigliato)
      - ./init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"running\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
